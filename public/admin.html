<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LightShow Admin Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial; background-color: #222; color: white; text-align: center; padding-top: 50px; }
        button { padding: 15px 30px; font-size: 20px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; }
        #status { margin-top: 20px; font-size: 18px; color: #ffc107; }
        #beatIndicator { width: 100px; height: 100px; background-color: gray; border-radius: 50%; margin: 30px auto; }
        .slider-container { margin-top: 30px; }
        input[type="range"] { width: 300px; }
    </style>
</head>
<body>

    <h1>Admin Beat Detector 🎛️</h1>
    <button id="startBtn">Start Audio Input</button>
    <div id="status">Waiting to start...</div>
    
    <!-- සංවේදීතාව පාලනය කරන Slider එක -->
    <div class="slider-container">
        <label for="sensitivity">Trigger Threshold: <span id="sensValue">150</span></label><br><br>
        <input type="range" id="sensitivity" min="50" max="250" value="150">
        <p style="font-size: 14px; color: #aaa;">(අගය අඩු කළ තරමට පොඩි සද්දෙටත් වැඩ කරනවා)</p>
    </div>

    <div id="beatIndicator"></div>

    <script>
        const socket = io();
        let audioContext, analyser, microphone, dataArray;
        let isCooldown = false;

        // Slider එකේ අගය ගන්නවා
        const slider = document.getElementById('sensitivity');
        const sensValue = document.getElementById('sensValue');
        
        slider.addEventListener('input', function() {
            sensValue.innerText = this.value;
        });

        document.getElementById('startBtn').addEventListener('click', async () => {
            document.getElementById('status').innerText = "Requesting Audio Access...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                
                microphone.connect(analyser);
                analyser.fftSize = 256; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                document.getElementById('status').innerText = "Listening to Audio... 🎧";
                document.getElementById('startBtn').style.display = 'none';

                detectBeat();
            } catch (err) {
                document.getElementById('status').innerText = "Error: " + err.message;
            }
        });

        function detectBeat() {
            analyser.getByteFrequencyData(dataArray);
            
            let bassSum = 0;
            for(let i = 0; i < 5; i++) {
                bassSum += dataArray[i];
            }
            let bassAvg = bassSum / 5;

            // Slider එකෙන් දෙන අගය (Threshold එක) මෙතනට ගන්නවා
            let currentThreshold = parseInt(slider.value);

            if (bassAvg > currentThreshold && !isCooldown) {
                socket.emit('admin_beat_detected', { timestamp: Date.now() });
                document.getElementById('beatIndicator').style.backgroundColor = 'white';
                
                isCooldown = true;
                setTimeout(() => {
                    isCooldown = false;
                    document.getElementById('beatIndicator').style.backgroundColor = 'gray';
                }, 300);
            }
            requestAnimationFrame(detectBeat);
        }
    </script>
</body>
</html>
